# Example: run CodeSentinel in your own pipeline.
# 1. Build CodeSentinel (or install it as a dependency).
# 2. Scan your source with --format sarif so results upload to code scanning.
name: CodeSentinel

on:
  push:
    branches: [main]
  pull_request:

permissions:
  security-events: write
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build CodeSentinel
        run: npm ci && npm run build

      - name: Scan with CodeSentinel
        run: node dist/cli.js . --format sarif --fail-on high > codesentinel.sarif || true

      - name: Upload SARIF to GitHub code scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: codesentinel.sarif

      - name: Fail on high severity findings
        run: node dist/cli.js . --severity high --fail-on high
